[project]
name = "mobility-lakehouse"
version = "1.0.0"
description = "Databricks lakehouse for NYC TLC ride-hailing data: idempotent bronze/silver/gold pipelines with Delta Lake and data quality checks."
readme = "README.md"
authors = [
    { name = "Nafiul Hadi Saputra", email = "nafiulhadisaputraa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mobility-lakehouse = "mobility_lakehouse.cli:main"
mobility-lakehouse-job = "mobility_lakehouse.databricks_job:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade, SIM simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["spark: needs a local Spark session with Delta Lake (run inside Docker or the CI Spark job)"]

[tool.pipeline-lint]
sql-dialect = "databricks"
fail-on = "warning"

[dependency-groups]
# The API runs outside Databricks, so its libraries are not dependencies of the job wheel (ADR 0011).
api = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
dev = [
    "httpx>=0.28",
    "pipeline-lint>=0.1.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
# Local Spark in Docker and the streaming tools that run next to it (ADR 0005, 0012).
spark = [
    "confluent-kafka>=2.6",
    "delta-spark==4.3.1",
    "pyspark==4.1.1",
]

[tool.uv]
# `uv sync` installs the API libraries too, so the API tests run with the rest. The Databricks wheel does not
# include them.
default-groups = ["dev", "api"]
