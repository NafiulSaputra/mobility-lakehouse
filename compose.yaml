# Local development services.
#   docker compose build spark
#   docker compose run --rm spark mobility-lakehouse profile --month 2025-01
#   docker compose up --build api        # API on http://localhost:8000, documentation on /docs
#   docker compose up -d redpanda        # Kafka-compatible broker for the streaming replay (ADR 0012)
services:
  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: mobility-lakehouse-spark:local
    working_dir: /workspace
    volumes:
      # The repository (code, data/ and docs/) is shared with the container, so results land on the host.
      - .:/workspace
    environment:
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-3g}
    ports:
      - "4040:4040" # Spark UI while a job runs: http://localhost:4040

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: mobility-lakehouse-api:local
    volumes:
      # Read-only: the API never changes the snapshot (ADR 0011).
      - ./data/snapshot:/data/snapshot:ro
    ports:
      - "8000:8000"

  # Single-node Redpanda for the streaming replay (ADR 0012). Containers reach it at redpanda:9092.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10
