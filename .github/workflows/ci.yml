name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # uv reads .python-version and installs Python 3.12 itself.
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies (must match uv.lock)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: pipeline-lint (rerun safety)
        run: uv run pipeline-lint check .

      - name: Tests
        run: uv run pytest

  spark:
    name: Spark tests (Delta Lake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Java 21 is the default JDK of Databricks Runtime 18 (ADR 0005).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies including PySpark and Delta Lake
        run: uv sync --locked --group spark

      - name: Spark tests (idempotency, schema contract)
        run: uv run pytest -m spark
