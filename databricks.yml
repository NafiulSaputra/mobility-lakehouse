# Databricks Asset Bundle: builds the project wheel and defines the monthly pipeline job (ADR 0009).
# The data quality dashboard (ADR 0010) is defined in resources/.
#
#   databricks bundle validate --profile mobility
#   databricks bundle deploy   --profile mobility
#   databricks bundle run monthly_pipeline --profile mobility --params month=2025-01
#   databricks bundle run export_snapshot  --profile mobility --params month=2025-01
#
# The raw files must already be in the volume /Volumes/<catalog>/<schema>/raw, and the volume
# /Volumes/<catalog>/<schema>/serving must exist for the API snapshot (see docs/runbook-databricks.md).

bundle:
  name: mobility-lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the schema
    default: workspace
  schema:
    description: Unity Catalog schema for the tables and the raw volume
    default: mobility
  warehouse_id:
    description: SQL warehouse that runs the dashboard queries, found by name so no workspace ID is committed
    lookup:
      warehouse: Serverless Starter Warehouse

artifacts:
  default:
    type: whl
    build: uv build --wheel
    path: .
    # Serverless caches environments per wheel version. A new version on every deploy makes sure the job
    # runs the code that was just deployed.
    dynamic_version: true

targets:
  dev:
    default: true
    mode: development

resources:
  jobs:
    monthly_pipeline:
      name: mobility-lakehouse monthly pipeline
      description: Load one TLC month into bronze, apply the quality rules (silver), rebuild gold and the API snapshot.
      max_concurrent_runs: 1

      parameters:
        - name: month
          default: "2025-01"

      environments:
        - environment_key: default
          spec:
            # Serverless environment version 5: Python 3.12 (ADR 0005).
            environment_version: "5"
            dependencies:
              - ./dist/*.whl

      tasks:
        - task_key: bronze
          environment_key: default
          python_wheel_task:
            package_name: mobility_lakehouse
            entry_point: mobility-lakehouse-job
            parameters: ["bronze", "--month", "{{job.parameters.month}}",
                         "--catalog", "${var.catalog}", "--schema", "${var.schema}"]

        - task_key: silver
          depends_on:
            - task_key: bronze
          environment_key: default
          python_wheel_task:
            package_name: mobility_lakehouse
            entry_point: mobility-lakehouse-job
            parameters: ["silver", "--month", "{{job.parameters.month}}",
                         "--catalog", "${var.catalog}", "--schema", "${var.schema}"]

        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: default
          python_wheel_task:
            package_name: mobility_lakehouse
            entry_point: mobility-lakehouse-job
            parameters: ["gold", "--month", "{{job.parameters.month}}",
                         "--catalog", "${var.catalog}", "--schema", "${var.schema}"]

        # Parquet copy of the month for the API (ADR 0011).
        - task_key: snapshot
          depends_on:
            - task_key: gold
          environment_key: default
          python_wheel_task:
            package_name: mobility_lakehouse
            entry_point: mobility-lakehouse-job
            parameters: ["snapshot", "--month", "{{job.parameters.month}}",
                         "--catalog", "${var.catalog}", "--schema", "${var.schema}"]

    # Only the snapshot step, for months whose gold tables already exist (ADR 0011).
    export_snapshot:
      name: mobility-lakehouse export snapshot
      description: Write one month of gold and quality counts as Parquet for the API.
      max_concurrent_runs: 1

      parameters:
        - name: month
          default: "2025-01"

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ./dist/*.whl

      tasks:
        - task_key: snapshot
          environment_key: default
          python_wheel_task:
            package_name: mobility_lakehouse
            entry_point: mobility-lakehouse-job
            parameters: ["snapshot", "--month", "{{job.parameters.month}}",
                         "--catalog", "${var.catalog}", "--schema", "${var.schema}"]
